<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · DGETI</title>
    <link rel="icon" href="img/icono.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="contenedor-formulario">
        <div class="formulario-header">
            <img src="img/icono.ico" alt="Logo" class="logo-mini" style="height:60px">
            <div class="formulario-icono" id="icono">🔐</div>
            <span class="badge" id="badge">ACCESO</span>
            <h1>Iniciar sesión</h1>
            <p>Solo pueden entrar usuarios dados de alta por el administrador.</p>
        </div>
        <div class="formulario-body">
            <form id="formLogin">
                <label for="identificador" id="lblId">Usuario</label>
                <input type="text" id="identificador" class="control-formulario" autocomplete="username" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" class="control-formulario" autocomplete="current-password" required>

                <label for="captcha">Captcha de seguridad</label>
                <div class="captcha-box">
                    <img id="captchaImg" alt="Captcha" width="170" height="56">
                    <button type="button" class="btn-refrescar" onclick="recargarCaptcha()" title="Nuevo código">🔄</button>
                </div>
                <input type="text" id="captcha" class="control-formulario" placeholder="Escribe los 5 caracteres" maxlength="5" autocomplete="off" required>

                <button type="submit" class="boton-registro">Ingresar al portal</button>
                <p id="mensajeError" class="mensaje-error"></p>
            </form>
            <div class="enlaces-form">
                <a href="menu_idx.html" class="volver">← Inicio</a>
                <a href="registro.html" class="volver" id="linkRegistro">Activar mi cuenta</a>
            </div>
        </div>
    </main>
    <footer></footer>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
